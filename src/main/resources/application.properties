# ============================================================
# =============  APPLICATION GENERAL CONFIG  =================
# ============================================================
spring.application.name=app
server.port=5000

# ============================================================
# =============  DATABASE CONFIG (MySQL)  ====================
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/newappwithreact?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# --- Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# =============  JPA / HIBERNATE CONFIG  =====================
# ============================================================
# 'update' is fine for dev, but for production use 'validate' and Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================================
# =============  EMAIL CONFIGURATION  ========================
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ============================================================
# =============  LOGGING CONFIGURATION  ======================
# ============================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.example.app=DEBUG
logging.file.name=logs/app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ============================================================
# =============  SCHEDULER CONFIGURATION  ====================
# ============================================================
# Cleanup job every 5 minutes (300000 ms)
app.cleanup.rate=300000

# ============================================================
# =============  SERVER CONFIGURATION  =======================
# ============================================================
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================================
# =============  ACTUATOR (Optional for monitoring) ==========
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

# ============================================================
# ======================== JWT ===============================
# ============================================================
jwt.secret=${JWT_SECRET}
# 900000 ms = 15 minutes
jwt.expiration-ms=900000
#1209600000 = 14 days (optional)
jwt.refresh-expiration-ms=1209600000  # 14 days (optional)
